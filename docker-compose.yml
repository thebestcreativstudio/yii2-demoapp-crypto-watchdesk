# Crypto Watchdesk
#   docker compose up -d --build
# → http://localhost:18100

x-app-env: &app-env
  APP_DEBUG: "1"
  COOKIE_VALIDATION_KEY: crypto-watchdesk-docker
  DB_DSN: mysql:host=mysql;dbname=crypto_watchdesk
  DB_USER: watchdesk
  DB_PASSWORD: secret
  FRONTEND_URL: http://localhost:18100
  COINGECKO_BASE_URL: https://api.coingecko.com/api/v3
  COINGECKO_API_KEY: ${COINGECKO_API_KEY:-}
  SYNC_INTERVAL_SECONDS: "900"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_STREAM: desk:sync
  CENTRIFUGO_HMAC_SECRET: crypto-watchdesk-centrifugo-hmac
  CENTRIFUGO_CHANNEL: desk

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: crypto_watchdesk
      MYSQL_USER: watchdesk
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v6.2.4
    restart: unless-stopped
    command: centrifugo -c config.json
    volumes:
      - ./docker/centrifugo.json:/centrifugo/config.json:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      redis:
        condition: service_healthy

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    ports:
      - "18101:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: watchdesk
      PMA_PASSWORD: secret
    depends_on:
      mysql:
        condition: service_healthy

  migrate:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"
    command: ["true"]
    depends_on:
      mysql:
        condition: service_healthy

  php:
    build: .
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "18100:80"
    volumes:
      - ./:/app:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
      - centrifugo

  # Pulls CoinGecko → writes snapshots → evaluates alerts
  worker:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          echo "[worker] sync..."
          php yii sync/once || true
          sleep "$${SYNC_INTERVAL_SECONDS:-300}"
        done
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
